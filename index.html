<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaraada Imposter Ithil?</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.875rem;
            margin-top: -0.75rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .player-chip {
            background: #334155;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-chip button {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .era-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
        }

        .screen.active {
            display: flex;
        }

        .card-box {
            background: #0f172a;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
            min-height: 200px;
        }

        .card-title {
            font-size: 1.25rem;
            color: var(--text-sub);
        }

        .card-main {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--accent);
        }

        .card-sub {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .hidden-content {
            filter: blur(8px);
            user-select: none;
            transition: filter 0.2s ease;
        }

        .revealed {
            filter: blur(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Aaraada Imposter Ithil?</h1>
        <div class="subtitle">Malayalam Movie Imposter Game</div>

        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="screen active">
            <div class="input-group">
                <label>Add Players (Min 3)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="playerNameInput" placeholder="Enter player name" style="flex: 1;">
                    <button class="btn" id="addPlayerBtn" style="width: auto; padding: 0.75rem 1rem;">Add</button>
                </div>
            </div>

            <div class="player-list" id="playerList"></div>

            <div class="input-group">
                <label>Select Era Categories</label>
                <div class="era-checkboxes">
                    <label class="checkbox-label"><input type="checkbox" class="era-cb" value="1" checked> Golden Era & Classics (1-33)</label>
                    <label class="checkbox-label"><input type="checkbox" class="era-cb" value="2" checked> Modern Classics / Y2K (34-62)</label>
                    <label class="checkbox-label"><input type="checkbox" class="era-cb" value="3" checked> Contemporary Blockbusters (63-89)</label>
                    <label class="checkbox-label"><input type="checkbox" class="era-cb" value="4" checked> Extended Hits & Recent (90-100)</label>
                </div>
            </div>

            <button class="btn" id="startGameBtn">Start Game</button>
        </div>

        <!-- PASS PHONE SCREEN -->
        <div id="passScreen" class="screen">
            <div class="card-box">
                <div class="card-title">Pass phone to</div>
                <div class="card-main" id="targetPlayerName">Player</div>
            </div>
            <button class="btn" id="readyBtn">I am <span id="readyPlayerName">Player</span></button>
        </div>

        <!-- REVEAL SCREEN -->
        <div id="revealScreen" class="screen">
            <div class="card-box">
                <div class="card-title" id="roleTitle">Your Role</div>
                <div id="secretContainer" class="hidden-content">
                    <div class="card-main" id="secretMovie">MOVIE NAME</div>
                    <div class="card-sub" id="secretHint"></div>
                </div>
            </div>
            <button class="btn btn-secondary" id="toggleRevealBtn">Tap to Reveal Secret</button>
            <button class="btn" id="nextPlayerBtn" style="display: none;">Next Player</button>
        </div>

        <!-- DISCUSSION / SUMMARY SCREEN -->
        <div id="discussionScreen" class="screen">
            <div class="card-box">
                <div class="card-main">Time to Discuss!</div>
                <div class="card-sub">Ask questions, state hints, and catch the Imposter!</div>
            </div>
            <button class="btn btn-danger" id="revealImposterBtn">Reveal Imposter & Movie</button>
            <div id="finalAnswers" style="display: none; text-align: center;" class="input-group">
                <div style="font-size: 1.1rem; color: var(--accent);" id="imposterNameResult"></div>
                <div style="font-size: 1.25rem; font-weight: bold;" id="movieResult"></div>
                <div style="color: var(--text-sub);" id="hintResult"></div>
            </div>
            <button class="btn" id="playAgainBtn" style="display: none;">Play Next Round (Same Players)</button>
            <button class="btn btn-secondary" id="resetAllBtn" style="display: none;">Reset All Settings</button>
        </div>
    </div>

    <script>
